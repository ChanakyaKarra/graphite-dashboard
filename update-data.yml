name: Fetch live data and update dashboard

# Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
# Also runs on every push so you can test changes manually.
# You can also trigger it by hand from the "Actions" tab in GitHub.

on:
  schedule:
    - cron: '0 */6 * * *'   # Every 6 hours
  workflow_dispatch:         # Manual trigger button
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_live_data.py'
      - '.github/workflows/update-data.yml'

# Required to commit the updated JSON file back to the repo
permissions:
  contents: write

# Force any nested Node.js 20 actions to run on Node.js 24.
# This suppresses the deprecation warning shown until upstream actions
# (e.g. upload-pages-artifact's internal upload-artifact dep) ship Node-24 builds.
# Safe to remove after June 2026 when Node 24 becomes the default.
# Reference: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run data fetcher
        env:
          # Optional: paste your free EIA API key in repo Settings → Secrets → Actions
          # If empty, the fetcher uses fallback US electricity prices (still works).
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/fetch_live_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-data.json
          # Only commit if file actually changed
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update live data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
